name: Clip iOS build

on:
  push:
    paths: ["Clip/**", ".github/workflows/clip-ios.yml"]
  pull_request:
    paths: ["Clip/**", ".github/workflows/clip-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app + widget for the iOS Simulator
        working-directory: Clip
        run: |
          xcodebuild -version
          xcodebuild build \
            -project Clip.xcodeproj \
            -target Clip \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
